# The Windows installer (features/desktop-app.md), built on Windows: by
# .github/workflows/release.yml, code-signed there (Azure Artifact Signing),
# or by scripts/build-desktop-win.sh on the Windows VM, unsigned, for the bench.
appId: ch.innonova.lwtree
productName: Long War Tech Tree
copyright: Anders Eggers-Krag
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - "!dist/*.test.js"
  - site/**/*
  # A dotfile: globs leave it out unless named (the base bundle's version).
  - site/.bundle-info.json
  - package.json
  # Where this build takes its updates from: trusted-updates, the product, the channel.
  - update.json
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: LongWarTechTree-Setup-${version}.exe
